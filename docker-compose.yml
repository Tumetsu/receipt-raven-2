# Runs Receipt Raven and its ledger service:
#   docker compose up --build    ->  http://localhost:8000
#
# LEDGER_DIR is the host directory holding ledger.beancount (default: the
# development ledger in this repository). Put the AI settings in .env.
services:
  beancount-service:
    build:
      context: .
      dockerfile: beancount-service/Dockerfile
    restart: unless-stopped
    environment:
      BEANCOUNT_LEDGER_PATH: /ledger/ledger.beancount
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ${LEDGER_DIR:-./dev-ledger}:/ledger
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      beancount-service:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: '["http://localhost:8000"]'
      BEANCOUNT_SERVICE_URL: http://beancount-service:8000
      TZ: ${TZ:-Europe/Helsinki}
    volumes:
      - app_data:/app/data
      - app_uploads:/app/uploads
      # Optional payee rules: backend/config/payee-account-rules.json
      - ./backend/config:/app/config:ro

volumes:
  app_data:
  app_uploads:
